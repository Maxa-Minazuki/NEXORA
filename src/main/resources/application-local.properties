# Жергілікті іске қосу: H2 файлдық дерекқоры (./data/jyly.mv.db), қайта іске қосқанда деректер сақталады.
spring.datasource.url=jdbc:h2:file:./data/jyly;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 Console: http://localhost:8080/h2-console (тек осы компьютерден)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# УАҚЫТША демо құпиясөз — тек жергілікті тексеру үшін, production-да ҚОЛДАНБАҢЫЗ.
# JYLY_ADMIN_PASSWORD орта айнымалысы берілсе, сол қолданылады.
jyly.admin.password=${JYLY_ADMIN_PASSWORD:jyly-demo-admin}

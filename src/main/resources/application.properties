spring.application.name=jyly
server.port=${PORT:8080}

# Әдепкі профиль — local (H2, қосымша орнатусыз). MySQL үшін: --spring.profiles.active=mysql
spring.profiles.default=local

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Almaty

# Thymeleaf / web
spring.thymeleaf.cache=false
spring.web.locale=kk_KZ
spring.web.locale-resolver=fixed
spring.messages.basename=messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Клуб ережелері
jyly.deposit-percent=30
jyly.zone=Asia/Almaty
jyly.opening-time=08:00
jyly.closing-time=22:00
jyly.slot-minutes=30
jyly.min-duration-minutes=60
jyly.max-duration-hours=12
jyly.max-days-ahead=90
jyly.free-cancellation-hours=24
jyly.seed-demo-data=true

# Әкімші: environment variables арқылы беріледі (README қараңыз)
jyly.admin.username=${JYLY_ADMIN_USERNAME:admin}
jyly.admin.password=${JYLY_ADMIN_PASSWORD:}

logging.level.kz.jyly=INFO

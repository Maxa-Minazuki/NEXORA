# MySQL профилі: .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Барлық құпия мәндер тек environment variables арқылы беріледі.
spring.datasource.url=${JYLY_DB_URL:jdbc:mysql://localhost:3306/jyly?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Almaty}
spring.datasource.username=${JYLY_DB_USERNAME:jyly}
spring.datasource.password=${JYLY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Production-да әкімші құпиясөзі міндетті түрде JYLY_ADMIN_PASSWORD арқылы беріледі.
jyly.admin.password=${JYLY_ADMIN_PASSWORD:}

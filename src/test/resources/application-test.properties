# Тесттер: жадтағы H2, әр іске қосу таза дерекқордан басталады.
spring.datasource.url=jdbc:h2:mem:jyly-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
jyly.admin.username=admin
jyly.admin.password=test-admin-password
jyly.seed-demo-data=true
logging.level.kz.jyly=WARN
